{%- assign p = include.paper -%}
{%- if p.links and p.links.size > 0 -%}
<div class="paper-links">
  {%- for l in p.links -%}
    <a class="btn btn-sm{% if include.primary and forloop.first %} btn-primary{% endif %}" href="{{ l.url | relative_url }}" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
      {{ l.label }}
    </a>
  {%- endfor -%}
</div>
{%- endif -%}
